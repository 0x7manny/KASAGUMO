[package]
name = "kasagumo"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10.9"
rand = "0.9.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "process", "sync"] }
serde_json = "1.0.151"
redb = "4.3.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ed25519-dalek = "2"


[[bin]]
name = "kgo"
path = "src/main.rs"
