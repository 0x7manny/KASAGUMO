[package]
name = "kasagumo"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10.9"
rand = "0.9.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
serde_json = "1.0.151"
redb = "4.3.0"


[[bin]]
name = "kgo"
path = "src/main.rs"
