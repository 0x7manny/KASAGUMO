name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: |
          cargo test --color never > test.txt 2>&1 || { echo "::error::$(grep -E 'FAILED|panicked|failed' -B1 -A5 test.txt | head -c 6000 | awk 'BEGIN{ORS="%0A"} {print}')"; exit 1; }
