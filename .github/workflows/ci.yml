name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings > clippy.txt 2>&1 || { rustc --version; echo "::error::$(grep -E '^(error|warning)' -A8 clippy.txt | head -c 5000 | awk 'BEGIN{ORS="%0A"} {print}')"; tail -5 clippy.txt; exit 1; }
      - run: cargo test
